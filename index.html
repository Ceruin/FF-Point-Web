<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Placeholder — A Neon Venue</title>

    <!-- Fonts: Neonderthaw (venue script), Orbitron (HUD), Rajdhani (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Neonderthaw&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ============================================================
         AMBIENT LAYERS  (background, particles, vignette, flicker)
         ============================================================ -->
    <div class="bg-scene" aria-hidden="true"></div>
    <canvas id="particles" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div id="flicker-dim" aria-hidden="true"></div>

    <!-- ============================================================
         INTRO SEQUENCE  (typewriter lines -> "Enter the Venue")
         ============================================================ -->
    <div id="intro" class="intro">
        <div class="intro__inner">
            <p class="intro__line" data-text="Welcome, adventurer."></p>
            <p class="intro__line" data-text="You have arrived at Placeholder."></p>
            <p class="intro__line" data-text="Your objective: explore the venue before opening night."></p>
            <button id="enter-btn" class="btn btn--enter" hidden>
                <i class="fa-solid fa-door-open"></i> Enter the Venue
            </button>
        </div>
    </div>

    <!-- ============================================================
         MAIN SCENE  (revealed after intro)
         ============================================================ -->
    <main id="scene" class="scene" aria-hidden="true">

        <!-- ----- Quest tracker (collapsible on mobile) ----- -->
        <aside class="quest-tracker" id="quest-tracker">
            <button class="quest-tracker__toggle" id="quest-toggle" aria-expanded="true">
                <i class="fa-solid fa-scroll"></i> Quest Log
            </button>
            <div class="quest-tracker__body" id="quest-body">
                <ul class="quest-list" id="quest-list"><!-- injected by app.js --></ul>
                <p class="quest-complete" id="quest-complete" hidden>
                    <i class="fa-solid fa-trophy"></i>
                    Quest Complete: You are ready for opening night.
                </p>
            </div>
        </aside>

        <!-- ----- Top-right controls ----- -->
        <div class="controls">
            <button class="ctrl-btn" id="sound-toggle" title="Toggle sound" aria-label="Toggle sound">
                <i class="fa-solid fa-volume-xmark"></i>
            </button>
            <button class="ctrl-btn" id="share-btn" title="Copy venue invite" aria-label="Share venue">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
        </div>

        <!-- ----- Central HUD panel ----- -->
        <section class="hud" id="hud">
            <h1 class="hud__title">Placeholder</h1>
            <div class="hud__location">Crystal | Behemoth | Limsa | W1 | P1</div>

            <!-- Animated event card with live countdown -->
            <div class="event-card" id="event-card">
                <div class="event-card__label"><i class="fa-solid fa-star"></i> Tonight's Event</div>
                <div class="event-card__time">Saturday–Sunday | 11:00 PM – 3:00 AM</div>
                <div class="event-card__status">
                    <span class="event-card__state" id="event-state">Opens In</span>
                    <span class="event-card__clock" id="event-clock">00:00:00</span>
                </div>
            </div>
            <p class="hud__hint">Tap the glowing characters to explore the venue.</p>
        </section>

        <!-- ----- Clickable NPCs / objects ----- -->
        <!-- pointer-events handled per-child so the wrapper doesn't block the HUD -->
        <div class="npcs" id="npcs">

            <button class="npc npc--host" data-object="staff" data-quest="staff">
                <span class="npc__sprite">
                    <img src="images/px-point.png" alt="" class="npc__img">
                </span>
                <span class="npc__label">Host <em>· Staff</em></span>
            </button>

            <button class="npc npc--bartender" data-object="menu" data-quest="menu">
                <span class="npc__sprite">
                    <img src="images/px-azim.png" alt="" class="npc__img">
                </span>
                <span class="npc__label">Barkeep <em>· Menu</em></span>
            </button>

            <button class="npc npc--board" data-object="events" data-quest="events">
                <span class="npc__sprite npc__sprite--board">
                    <i class="fa-solid fa-scroll"></i>
                </span>
                <span class="npc__label">Notice Board <em>· Events</em></span>
            </button>

            <button class="npc npc--crystal" data-object="discord" data-quest="discord">
                <span class="npc__sprite npc__sprite--crystal">
                    <span class="crystal-gem"></span>
                </span>
                <span class="npc__label">Aether Crystal <em>· Fellowship</em></span>
            </button>
        </div>

        <!-- ----- Hidden mascot (secret easter egg) ----- -->
        <button class="mascot" id="mascot" aria-label="A tiny something is hiding here">
            <img src="images/curs-moogle.png" alt="">
        </button>

        <!-- ----- Wandering minion (flies across occasionally) ----- -->
        <div class="wanderer" id="wanderer" aria-hidden="true">
            <img src="images/px-bunny.png" alt="">
        </div>
    </main>

    <!-- ============================================================
         RPG DIALOGUE SYSTEM  (single reusable modal)
         ============================================================ -->
    <div class="dialogue-overlay" id="dialogue-overlay" hidden>
        <div class="dialogue" id="dialogue" role="dialog" aria-modal="true" aria-labelledby="dialogue-name">
            <button class="dialogue__close" id="dialogue-close" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <header class="dialogue__header">
                <div class="dialogue__avatar" id="dialogue-avatar"></div>
                <h2 class="dialogue__name" id="dialogue-name"></h2>
            </header>
            <div class="dialogue__body" id="dialogue-body"></div>
            <footer class="dialogue__actions" id="dialogue-actions"></footer>
        </div>
    </div>

    <!-- ============================================================
         POPUPS  (achievement + toast)
         ============================================================ -->
    <div class="achievement" id="achievement" hidden>
        <div class="achievement__icon"><i class="fa-solid fa-award"></i></div>
        <div class="achievement__copy">
            <div class="achievement__kicker">Achievement</div>
            <div class="achievement__text" id="achievement-text"></div>
        </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="app.js"></script>
</body>
</html>
